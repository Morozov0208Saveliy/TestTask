[versions]
android-gradle-plugin = "8.5.2"
gson = "2.10.1"
kotlin = "2.0.21"
browser = "1.8.0"
retrofit = "2.9.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
androidx-core = { module = "androidx.core:core", version = "1.12.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.12.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.6.1" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
material = { module = "com.google.android.material:material", version = "1.11.0" }
androidx-activity = { module = "androidx.activity:activity-compose", version = "1.8.2" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.1.4" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.0" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version = "2.8.0" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version = "2.8.0" }
androidx-navigation-dynamic-features = { module = "androidx.navigation:navigation-dynamic-features-fragment", version = "2.8.0" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version = "2.8.0" }

lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.7.0" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.7.0" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.6.3" }

junit = { module = "junit:junit", version = "4.13.2" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.1.5" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version = "3.5.1" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
